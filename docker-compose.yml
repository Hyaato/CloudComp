versão: "3.9"

services:
  backend:
    build: ./backend
    container_name: api-backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=banco
      - DB_PORT=5432
      - DB_USER=appuser
      - DB_PASSWORD=apppass
      - DB_NAME=minhadb
    depends_on:
      banco:
        condition: service_healthy
    networks:
      redelab:
        ipv4_address: 172.28.0.10

  banco:
    image: postgres:16
    container_name: banco-dados
    environment:
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=apppass
      - POSTGRES_DB=minhadb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      redelab:
        ipv4_address: 172.28.0.11

networks:
  redelab:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  pgdata:   
